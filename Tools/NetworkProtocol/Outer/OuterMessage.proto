syntax = "proto3";
package Fantasy.Network.Message;

// 协议分为:
// ProtoBuf:可以在Outer和Inner文件里使用。
// MemoryPack:可以在Outer和Inner文件里使用。

// 目前工具支持以下几种特殊用法:
// 在message协议上方添加// Protocol+空格+协议名字
// 例如: // Protocol ProtoBuf 或 // Protocol MemoryPack

// 分别代表使用Protobuf序列化或使用MemoryPack序列化
// 通过添加 // using 导出时添加自定义命名空间
// 例如: // using System.Runtime // using System.Reflection


message C2G_TestMessage // IMessage
{
	string Tag = 1;
}
message C2G_TestRequest // IRequest,G2C_TestResponse
{
	string Tag = 1;
}
message G2C_TestResponse // IResponse
{
	string Tag = 1;
}
// 使用 HTTP 认证签发的一次性票据登录游戏服。
message C2G_LoginRequest // IRequest,G2C_LoginResponse
{
	// 废弃字段，仅保留原编号；服务端忽略客户端声称的玩家编号。
	int Id = 1;
	// 绑定目标 Gate、玩家和当前登录授权的一次性票据。
	string Ticket = 2;
}
// 游戏服确认的认证结果和玩家资料。
message G2C_LoginResponse // IResponse
{
	// 面向玩家的登录结果说明。
	string Tag = 1;
	// 服务端确认的玩家编号；字段 2 留给工具生成的 ErrorCode。
	int PlayerId = 3;
	// 玩家显示名称。
	string PlayerName = 4;
}
// 当前会话已被另一次登录替换，客户端应停止重连并返回登录页。
message G2C_LoginRevoked // IMessage
{
	// 认证业务错误码。
	uint Reason = 1;
	// 可向玩家展示的退出原因。
	string Message = 2;
}
message FrameCommand
{
	int Uid = 1;
	int CommandType = 2;
	int x = 3;
	int y = 4;
	int z = 5;
}
message OneFrameCommand
{
	int FrameId =1;
	repeated FrameCommand UnitFrameCommand = 2;
}
message G2C_FrameCommand // IMessage
{
	int FrameId =1;
	repeated OneFrameCommand Commands = 2;
}
message C2G_NextFrameCommand // IMessage
{
	// 客户端已完成模拟的连续服务端帧号。
	int AckFrameId = 1;
	repeated FrameCommand Commands = 2;
	// 每个连接内单调递增，用于将输入去重与帧确认解耦。
	int InputSequence = 3;
}
message C2G_FrameAck // IMessage
{
	// 客户端已完成模拟的连续服务端帧号。
	int AckFrameId = 1;
}
message C2G_FrameFetchRequest // IMessage
{
	// 调用方当前所属的对局标识，用于拒绝过期房间请求。
	int MatchId = 1;
	// 需要补取的第一个连续逻辑帧号。
	int StartFrameId = 2;
}
message C2G_CreateFrameRoom // IRequest,G2C_CreateFrameRoom
{
	// 创建房间使用的副本配置标识。
	int DungeonId = 1;
	// 创建房间使用的副本类型。
	int DungeonType = 2;
	// 创建者选择的英雄配置标识。
	int HeroId = 3;
}
message G2C_CreateFrameRoom // IResponse
{
	// 操作结果，零表示成功。
	uint ErrorCode = 1;
	// 失败时返回的可定位原因。
	string ErrorMessage = 2;
	// 成功创建后的双人房间标识。
	int RoomId = 3;
}
message C2G_JoinFrameRoom // IRequest,G2C_JoinFrameRoom
{
	// 要加入的双人房间标识。
	int RoomId = 1;
	// 加入者选择的英雄配置标识。
	int HeroId = 2;
}
message G2C_JoinFrameRoom // IResponse
{
	// 操作结果，零表示成功。
	uint ErrorCode = 1;
	// 失败时返回的可定位原因。
	string ErrorMessage = 2;
	// 成功加入的房间标识。
	int RoomId = 3;
}
message FrameMatchPlayer
{
	int PlayerId = 1;
	repeated int HeroIds = 2;
	int Position = 3;
}
message G2C_FrameMatchBootstrap // IMessage
{
	int MatchId = 1;
	int RandomSeed = 2;
	int DungeonId = 3;
	int DungeonType = 4;
	int CurrentFrameId = 5;
	repeated FrameMatchPlayer Players = 6;
}

// 账号任务目标进度。任务状态与剧情标记分域保存于同一玩家进度文档。
message PlayerObjectiveProgress
{
    int ObjectiveId = 1;
    int Count = 2;
}
message PlayerQuestProgress
{
    int QuestId = 1;
    int Status = 2;
    repeated PlayerObjectiveProgress Objectives = 3;
    bool BriefingAcknowledged = 4;
}
message PlayerStoryFlag
{
    string Key = 1;
    bool Value = 2;
}
message PlayerItemStack
{
    int ItemId = 1;
    int Count = 2;
}
// 从当前认证会话读取账号进度；请求不包含玩家 ID。
message C2G_LoadPlayerProgress // IRequest,G2C_LoadPlayerProgress
{
    int MapId = 1;
}
message G2C_LoadPlayerProgress // IResponse
{
    uint ErrorCode = 1;
    string ErrorMessage = 2;
    long Revision = 3;
    repeated PlayerQuestProgress Quests = 4;
    repeated PlayerStoryFlag StoryFlags = 5;
    repeated PlayerItemStack Items = 6;
}
// 客户端提交一个幂等事件，账号身份始终由 Gate 认证会话决定。
message C2G_SubmitPlayerProgressEvent // IRequest,G2C_SubmitPlayerProgressEvent
{
    string RequestId = 1;
    int EventType = 2;
    int QuestId = 3;
    int ObjectiveId = 4;
    int MapId = 5;
    int MapInstanceId = 6;
    int SourceId = 7;
    int Count = 8;
    int DialogueId = 9;
    int DialogueNodeId = 10;
}
message G2C_SubmitPlayerProgressEvent // IResponse
{
    uint ErrorCode = 1;
    string ErrorMessage = 2;
    long Revision = 3;
    repeated PlayerQuestProgress Quests = 4;
    repeated PlayerStoryFlag StoryFlags = 5;
    repeated PlayerItemStack Items = 6;
}
